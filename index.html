<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roleta — Patologia Clínica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a1628;font-family:system-ui,sans-serif}
body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh}
#app{
  width:100%;min-height:100vh;
  padding:1.4rem 1.4rem 2rem;
  background:linear-gradient(135deg,#0a1628 0%,#0d2444 40%,#0a1e3a 70%,#0d1f3c 100%);
  position:relative;overflow:hidden
}
#app::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(55,138,221,0.12) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 50%,rgba(29,158,117,0.10) 0%,transparent 60%)
}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite alternate}
@keyframes twinkle{0%{opacity:.1}100%{opacity:.7}}

#fsBtn{
  position:absolute;top:14px;right:14px;z-index:30;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);
  color:#fff;border-radius:10px;padding:8px 16px;font-size:15px;
  cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s
}
#fsBtn:hover{background:rgba(255,255,255,0.22)}
#fsBtn svg{width:18px;height:18px;flex-shrink:0}

h1{font-size:24px;font-weight:600;color:#fff;text-align:center;margin-bottom:4px;letter-spacing:.5px}
.subtitle{font-size:14px;color:rgba(255,255,255,.55);text-align:center;margin-bottom:1rem}

.score-bar{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
.score-item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 20px;text-align:center}
.score-item span{display:block;font-size:24px;font-weight:600;color:#fff}
.score-item label{font-size:12px;color:rgba(255,255,255,.5)}

.main-layout{display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}
.wheel-section{display:flex;flex-direction:column;align-items:center;gap:1rem}
.canvas-wrap{position:relative;width:480px;height:480px;flex-shrink:0}
canvas{border-radius:50%;display:block;box-shadow:0 0 60px rgba(55,138,221,.3),0 0 120px rgba(55,138,221,.1)}
.pointer-wrap{position:absolute;top:50%;left:-26px;transform:translateY(-50%);z-index:10}
.pointer-wrap svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.center-hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 0 14px rgba(0,0,0,.4);z-index:5
}
.spin-btn{
  padding:14px 52px;font-size:19px;font-weight:600;cursor:pointer;
  border-radius:40px;border:none;
  background:linear-gradient(135deg,#378ADD,#185FA5);color:#fff;
  box-shadow:0 4px 20px rgba(55,138,221,.4);transition:transform .15s,box-shadow .15s
}
.spin-btn:hover{transform:scale(1.04);box-shadow:0 6px 28px rgba(55,138,221,.55)}
.spin-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.conf-msg{text-align:center;font-size:15px;color:rgba(255,255,255,.7);margin-top:.3rem}

.popup-area{width:480px;min-height:480px;max-height:calc(100vh - 200px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;align-self:flex-start}
.balloon-wrap{position:relative;width:100%;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.balloon{
  background:#fff;border-radius:26px;border:1px solid #ddd;
  padding:2rem 2rem 1.6rem;position:relative;
  box-shadow:0 10px 50px rgba(0,0,0,.35);width:100%
}
.balloon::after{
  content:'';position:absolute;right:-22px;top:50%;transform:translateY(-50%);
  border-width:13px 0 13px 22px;border-style:solid;
  border-color:transparent transparent transparent #fff;
  filter:drop-shadow(3px 0 2px rgba(0,0,0,.08))
}
.badge{display:inline-block;font-size:17px;font-weight:700;padding:7px 18px;border-radius:20px;margin-bottom:14px}
.badge-name{background:#EAF3DE;color:#27500A}
.badge-q{background:#E6F1FB;color:#0C447C}
.balloon h3{font-size:26px;font-weight:700;color:#111;margin-bottom:16px;line-height:1.35}
.big-name{font-size:64px;font-weight:800;color:#185FA5;text-align:center;padding:16px 0;letter-spacing:1px}
.name-hint{font-size:22px;color:#555;text-align:center;margin-top:10px;font-weight:500}

.opts{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.opt-btn{
  text-align:left;padding:15px 20px;
  border:2px solid #ccc;border-radius:10px;
  background:#fafafa;color:#111;
  font-size:21px;cursor:pointer;line-height:1.4;font-weight:500;
  transition:background .1s
}
.opt-btn:hover:not(:disabled){background:#f0f0f0}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:#EAF3DE;border-color:#639922;color:#1a4000;font-weight:700}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#4a0000}

.exp-box{
  background:#FFFBEA;border:2px solid #F9A825;border-radius:10px;
  padding:20px;font-size:22px;color:#3a2800;line-height:1.6;
  margin-bottom:14px;display:none;font-weight:500
}
.balloon-btn{
  display:block;width:100%;padding:16px;border-radius:10px;
  border:2px solid #ccc;background:#fafafa;color:#111;
  font-size:20px;font-weight:600;cursor:pointer;text-align:center;
  transition:background .1s
}
.balloon-btn:hover{background:#f0f0f0}

.waiting-hint{
  font-size:22px;color:#c8dff5;padding:18px 32px;
  background:rgba(55,138,221,0.18);border:1px solid rgba(55,138,221,0.35);
  border-radius:16px;overflow:hidden;white-space:nowrap;width:100%;max-width:480px
}
.waiting-hint span{display:inline-block;animation:marqueeScroll 14s linear infinite;padding-left:100%}
@keyframes marqueeScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

.phase-box{
  display:flex;flex-direction:column;gap:12px;align-items:center;
  width:100%;max-width:480px
}
.phase-btn{
  padding:16px 40px;font-size:20px;font-weight:700;cursor:pointer;
  border-radius:40px;border:none;color:#fff;
  background:linear-gradient(135deg,#1D9E75,#0F6E56);
  box-shadow:0 4px 20px rgba(29,158,117,.35);transition:transform .15s
}
.phase-btn:hover{transform:scale(1.04)}
.phase-note{
  color:rgba(255,255,255,.75);font-size:15px;text-align:center;line-height:1.4
}

.fim-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  animation:fadeIn .4s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fim-box{
  background:#fff;border-radius:28px;padding:2.8rem 3.2rem;
  text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.5);
  max-width:500px;width:90%;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)
}
.fim-trophy{font-size:80px;margin-bottom:1rem;display:block}
.fim-title{font-size:36px;font-weight:800;color:#0d2444;margin-bottom:.5rem}
.fim-sub{font-size:22px;color:#444;margin-bottom:1.8rem}
.fim-stats{display:flex;gap:1.5rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap}
.fim-stat{background:#f0f4ff;border-radius:14px;padding:16px 26px;text-align:center}
.fim-stat strong{display:block;font-size:36px;color:#185FA5;font-weight:800}
.fim-stat small{font-size:15px;color:#555}
.fim-btn{
  padding:16px 52px;font-size:20px;font-weight:700;cursor:pointer;
  border-radius:40px;border:none;
  background:linear-gradient(135deg,#378ADD,#185FA5);color:#fff;
  box-shadow:0 4px 20px rgba(55,138,221,.4);transition:transform .15s
}
.fim-btn:hover{transform:scale(1.04)}

@media (max-width: 1040px){
  .canvas-wrap,.popup-area{width:420px}
  .canvas-wrap{height:420px}
  .big-name{font-size:52px}
  .opt-btn{font-size:18px}
}
@media (max-width: 500px){
  .canvas-wrap,.popup-area{width:100%}
  .canvas-wrap{height:auto;aspect-ratio:1/1}
  canvas{width:100%;height:100%}
  .big-name{font-size:42px}
  .balloon h3{font-size:22px}
  .opt-btn{font-size:17px;padding:13px 16px}
}
</style>
</head>
<body>
<div id="app">
  <div class="stars" id="starsContainer"></div>

  <button id="fsBtn" onclick="toggleFullscreen()">
    <svg id="fsIconSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"/>
      <polyline points="9 21 3 21 3 15"/>
      <line x1="21" y1="3" x2="14" y2="10"/>
      <line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
    <span id="fsLabel">Ecrã inteiro</span>
  </button>

  <h1>Roleta — Patologia Clínica</h1>
  <p class="subtitle">Parte um · Parte dois · Sorteio sem repetição dentro de cada parte</p>

  <div class="score-bar">
    <div class="score-item"><span id="sc-total">0</span><label>Rodadas</label></div>
    <div class="score-item"><span id="sc-correct">0</span><label>Corretas ✓</label></div>
    <div class="score-item"><span id="sc-wrong">0</span><label>Erradas ✗</label></div>
    <div class="score-item"><span id="sc-pct">—</span><label>Taxa</label></div>
  </div>

  <div class="main-layout">
    <div class="wheel-section">
      <div class="canvas-wrap">
        <canvas id="wheel" width="480" height="480"></canvas>
        <div class="center-hub">★</div>
        <div class="pointer-wrap">
          <svg width="36" height="36" viewBox="0 0 28 28">
            <polygon points="28,14 0,4 6,14 0,24" fill="#E24B4A" stroke="#fff" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <button class="spin-btn" id="spinBtn" disabled>Parte um</button>
      <p class="conf-msg" id="confMsg"></p>
    </div>

    <div class="popup-area" id="popupArea">
      <div class="phase-box">
        <button class="phase-btn" id="phaseBtn">Iniciar Parte um</button>
        <div class="phase-note">
          Clique para iniciar a primeira parte.<br>
          A roleta sorteará primeiro o colega, depois a questão.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── DADOS ─────────────────────────────────────────────────── */
const PART1_QUESTIONS = [
  {
    q:"Qual é a norma internacional específica para laboratórios clínicos, reconhecida em Portugal pelo IPAC?",
    opts:["ISO 9001","ISO 15189","PNAEQ","ISO 17025"],
    correct:1,
    exp:"A ISO 15189 é a norma internacional específica para laboratórios clínicos. Garante competência técnica e qualidade dos resultados, sendo reconhecida em Portugal pelo IPAC."
  },
  {
    q:"Qual a percentagem aproximada de erros laboratoriais que ocorre na fase pré-analítica?",
    opts:["10 a 15%","15 a 25%","60 a 70%","80 a 90%"],
    correct:2,
    exp:"A fase pré-analítica concentra 60 a 70% dos erros laboratoriais, tornando-a a mais crítica de todo o processo."
  },
  {
    q:"Qual é a ordem correta de colheita dos tubos (OCD)?",
    opts:["EDTA → citrato → gel","Citrato → gel → EDTA","Gel → EDTA → citrato","Citrato → EDTA → gel"],
    correct:1,
    exp:"A Ordem Correta de Colheita é: primeiro citrato (azul), depois gel separador (amarelo) e por último EDTA (violeta), para evitar contaminação entre aditivos."
  },
  {
    q:"Para que análise se usa o tubo com citrato de sódio (azul)?",
    opts:["Hemograma completo","Glicémia em jejum","Estudo da coagulação (TP, APTT, fibrinogénio)","Marcadores tumorais"],
    correct:2,
    exp:"O tubo azul contém citrato de sódio a 3,2% e é usado para o estudo da coagulação: TP, APTT e fibrinogénio."
  },
  {
    q:"O que é o antibiograma e em que setor é realizado?",
    opts:["Estudo de anticorpos, realizado na Imunologia","Teste de sensibilidade a antibióticos, realizado na Microbiologia","Contagem de células, realizado na Hematologia","Análise hormonal, realizado na Bioquímica"],
    correct:1,
    exp:"O antibiograma testa a sensibilidade de bactérias a antibióticos e é realizado no setor de Microbiologia."
  },
  {
    q:"Qual dos seguintes equipamentos separa os componentes do sangue por força centrífuga?",
    opts:["Microscópio óptico","Autoclave","Centrífuga","Câmara de fluxo laminar"],
    correct:2,
    exp:"A centrífuga separa os componentes do sangue por densidade usando a força centrífuga, sendo essencial antes das análises bioquímicas."
  },
  {
    q:"O que faz o TAS na gestão de stocks do laboratório?",
    opts:["Valida clinicamente os resultados das análises","Analisa as amostras nos equipamentos automáticos","Verifica e repõe consumíveis, regista validades e faz inventários","Decide quais amostras devem ser rejeitadas"],
    correct:2,
    exp:"O TAS colabora na reposição e organização dos materiais, verifica validades usando o método FEFO e realiza inventários periódicos."
  },
  {
    q:"Qual é a função da câmara de fluxo laminar no laboratório?",
    opts:["Conservar amostras a baixa temperatura","Esterilizar material reutilizável por vapor","Proteger o técnico e as amostras de contaminações","Amplificar sequências de ADN para diagnóstico molecular"],
    correct:2,
    exp:"A câmara de fluxo laminar protege o técnico e as amostras de contaminações. Usa filtros HEPA e limpeza UV, sendo usada em microbiologia e biologia molecular."
  },
  {
    q:"Qual é o papel do médico patologista na fase pós-analítica?",
    opts:["Realizar a colheita de sangue venoso","Transportar as amostras ao laboratório","Fazer a validação clínica e identificar valores críticos","Centrifugar e aliquotar as amostras"],
    correct:2,
    exp:"Na fase pós-analítica, o médico patologista interpreta os resultados no contexto clínico, identifica valores críticos e pode adicionar notas interpretativas ao relatório."
  }
];

const PART2_QUESTIONS = [
  {
    q:"O TAS pode realizar colheitas de sangue venoso de forma autónoma.",
    opts:["Verdadeiro","Falso"],
    correct:1,
    exp:"Falso. A colheita de sangue venoso é da competência exclusiva do enfermeiro ou do TSDT de Análises Clínicas. O TAS apoia o processo mas não realiza a colheita autonomamente."
  },
  {
    q:"O método FEFO significa que se deve usar primeiro o material com prazo de validade mais curto.",
    opts:["Verdadeiro","Falso"],
    correct:0,
    exp:"Verdadeiro. FEFO significa 'First Expired, First Out': o material que expira primeiro deve ser utilizado primeiro, garantindo que nenhum consumível ultrapasse o prazo de validade."
  },
  {
    q:"A câmara de fluxo laminar usa filtros HEPA e limpeza com UV para evitar contaminações.",
    opts:["Verdadeiro","Falso"],
    correct:0,
    exp:"Verdadeiro. A câmara de fluxo laminar recorre a filtros HEPA e radiação UV para proteger o técnico e as amostras de contaminações em microbiologia e biologia molecular."
  },
  {
    q:"O PCR (termociclador) é usado para separar os componentes do sangue antes da análise bioquímica.",
    opts:["Verdadeiro","Falso"],
    correct:1,
    exp:"Falso. O PCR amplifica sequências de ADN/ARN para diagnóstico molecular. Quem separa os componentes do sangue é a centrífuga."
  },
  {
    q:"As amostras fotossensíveis devem ser protegidas da luz solar durante o transporte.",
    opts:["Verdadeiro","Falso"],
    correct:0,
    exp:"Verdadeiro. Algumas amostras são fotossensíveis e degradam-se com a exposição à luz, pelo que devem ser protegidas durante todo o transporte."
  },
  {
    q:"O contentor rígido amarelo destina-se apenas a resíduos de risco biológico sem perfurocortantes.",
    opts:["Verdadeiro","Falso"],
    correct:1,
    exp:"Falso. O contentor rígido amarelo (Grupo IV) destina-se exatamente a materiais cortantes e perfurantes, como agulhas. Os resíduos biológicos sem cortantes vão para o saco branco do Grupo III."
  },
  {
    q:"A rastreabilidade significa que cada amostra tem registo completo do percurso, do técnico e do equipamento usado.",
    opts:["Verdadeiro","Falso"],
    correct:0,
    exp:"Verdadeiro. A rastreabilidade é um dos pilares da qualidade laboratorial e garante que é possível reconstituir todo o percurso de uma amostra."
  },
  {
    q:"Na fase pós-analítica, os valores críticos ('panic values') devem ser comunicados imediatamente ao médico prescritor.",
    opts:["Verdadeiro","Falso"],
    correct:0,
    exp:"Verdadeiro. Valores críticos são resultados que implicam risco imediato para o utente e exigem notificação urgente ao clínico prescritor, mesmo antes da emissão formal do relatório."
  },
  {
    q:"O autoclave esteriliza material reutilizável através de vapor saturado a pressão, a cerca de 121°C.",
    opts:["Verdadeiro","Falso"],
    correct:0,
    exp:"Verdadeiro. O autoclave usa vapor saturado sob pressão a 121°C durante 15 minutos para esterilizar material reutilizável e inativar resíduos biológicos antes da eliminação."
  }
];

const NAMES = ["Carlos","Célia","Gabriel","Gisela","Goreti","Manuela","Márcia","Mariana","Sandra"];

/* ── MODO ATUAL: 'names' ou 'questions' ────────────────────── */
// spinMode controla o que a roleta vai sortear na próxima volta
// 'names'     → sorteio de colega
// 'questions' → sorteio de questão (após colega já escolhido)

const COLORS = [
  ["#378ADD","#185FA5"],["#1D9E75","#0F6E56"],["#D85A30","#993C1D"],
  ["#D4537E","#993556"],["#7F77DD","#534AB7"],["#BA7517","#854F0B"],
  ["#E24B4A","#A32D2D"],["#5DCAA5","#0F6E56"],["#639922","#3B6D11"]
];

/* ── ESTADO ─────────────────────────────────────────────────── */
const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');

let partIndex    = -1;   // 0 = parte 1, 1 = parte 2
let partData     = null; // { label, questions, type }
let spinMode     = 'names';   // 'names' | 'questions'
let usedNames    = [];
let usedQuestions= [];
let pendingName  = '';   // colega já sorteado, aguarda questão
let partRound    = 0;    // questões respondidas nesta parte
let spinning     = false;
let currentAngle = 0;

let totalR = 0, correctC = 0, wrongC = 0;

/* ── PARTIDAS ───────────────────────────────────────────────── */
const PARTS = [
  { label:"Parte um",  questions: PART1_QUESTIONS, type:"mcq" },
  { label:"Parte dois",questions: PART2_QUESTIONS, type:"tf"  }
];

/* ── ÁUDIO ──────────────────────────────────────────────────── */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function getACtx(){ if(!actx) actx = new AudioCtx(); return actx; }
function playTick(){ try{ const a=getACtx(),o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(800,a.currentTime);g.gain.setValueAtTime(0.06,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.04);o.start();o.stop(a.currentTime+0.04);}catch(e){}}
function playPop(){  try{ const a=getACtx(),o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(440,a.currentTime);o.frequency.exponentialRampToValueAtTime(880,a.currentTime+0.1);g.gain.setValueAtTime(0.15,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);o.start();o.stop(a.currentTime+0.15);}catch(e){}}
function playWin(){  try{ const a=getACtx();[523,659,784,1047].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=f;const t=a.currentTime+i*0.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.18,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.start(t);o.stop(t+0.25);});}catch(e){}}
function playWrong(){try{ const a=getACtx();[330,220].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sawtooth';o.frequency.value=f;const t=a.currentTime+i*0.15;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);});}catch(e){}}
function playFanfare(){try{const a=getACtx();[523,659,784,1047,784,1047,1047,1319].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=f;const t=a.currentTime+[0,.15,.30,.45,.65,.80,1.00,1.15][i];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.22,t+0.04);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);o.start(t);o.stop(t+0.3);});}catch(e){}}

/* ── ESTRELAS ───────────────────────────────────────────────── */
(function(){
  const cont = document.getElementById('starsContainer');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    cont.appendChild(s);
  }
})();

/* ── DESENHAR ROLETA ─────────────────────────────────────────── */
// items = array de strings a mostrar nos segmentos
function drawWheel(angle, items){
  const n = items.length;
  const arc = (2*Math.PI)/n;
  const cx=240, cy=240, r=232;
  ctx.clearRect(0,0,480,480);
  for(let i=0;i<n;i++){
    const s=angle+i*arc, e=s+arc;
    const grad=ctx.createRadialGradient(cx,cy,70,cx,cy,r);
    grad.addColorStop(0,COLORS[i%COLORS.length][0]);
    grad.addColorStop(1,COLORS[i%COLORS.length][1]);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2;ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(s+arc/2);
    ctx.textAlign='right';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.font='bold 16px sans-serif';
    ctx.fillText(items[i], r-16, 6);
    ctx.restore();
  }
  // hub
  ctx.beginPath();ctx.arc(cx,cy,32,0,2*Math.PI);
  const hg=ctx.createRadialGradient(cx-6,cy-6,2,cx,cy,32);
  hg.addColorStop(0,'#ffffff');hg.addColorStop(1,'#e0e0e0');
  ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();
}

function currentItems(){
  // O que mostrar na roleta depende do modo
  if(!partData) return NAMES;
  return spinMode === 'names' ? NAMES : partData.questions.map((_,i)=>`Q${i+1}`);
}

drawWheel(0, NAMES);

/* ── HELPERS ─────────────────────────────────────────────────── */
function getSegmentAtPointer(angle, n){
  const arc=(2*Math.PI)/n;
  let a=((Math.PI-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  return Math.floor(a/arc)%n;
}

function pickRandom(len, used){
  const avail=[...Array(len).keys()].filter(i=>!used.includes(i));
  if(!avail.length){ used.length=0; return Math.floor(Math.random()*len); }
  return avail[Math.floor(Math.random()*avail.length)];
}

function updateScore(){
  document.getElementById('sc-total').textContent   = totalR;
  document.getElementById('sc-correct').textContent = correctC;
  document.getElementById('sc-wrong').textContent   = wrongC;
  document.getElementById('sc-pct').textContent     = totalR>0 ? Math.round(correctC/totalR*100)+'%' : '—';
}

function setSpinBtn(text, enabled){
  const btn = document.getElementById('spinBtn');
  btn.textContent = text;
  btn.disabled = !enabled;
}

/* ── SETUP DE PARTE ──────────────────────────────────────────── */
function setupPart(idx){
  partIndex  = idx;
  partData   = PARTS[idx];
  spinMode   = 'names';
  usedNames  = [];
  usedQuestions = [];
  pendingName   = '';
  partRound     = 0;

  drawWheel(currentAngle, NAMES);
  setSpinBtn('Girar — Sortear Colega', true);
  document.getElementById('spinBtn').onclick = handleSpin;
  document.getElementById('confMsg').textContent = '';
  document.getElementById('popupArea').innerHTML =
    '<p class="waiting-hint"><span>Gira a roleta para sortear um colega!</span></p>';
}

/* ── SPIN ─────────────────────────────────────────────────────── */
function handleSpin(){
  if(spinning || !partData) return;
  getACtx();
  spinning = true;
  setSpinBtn('A girar…', false);

  const items = currentItems();
  const n     = items.length;
  const arc   = (2*Math.PI)/n;

  // Escolher índice alvo
  let targetIdx;
  if(spinMode === 'names'){
    targetIdx = pickRandom(NAMES.length, usedNames);
    usedNames.push(targetIdx);
  } else {
    targetIdx = pickRandom(partData.questions.length, usedQuestions);
    usedQuestions.push(targetIdx);
  }

  const segCenter = Math.PI - (targetIdx + 0.5) * arc;
  const fullSpins = (6 + Math.floor(Math.random()*4)) * 2*Math.PI;
  const jitter    = (Math.random()-0.5)*arc*0.65;
  let delta = (segCenter + jitter - currentAngle) % (2*Math.PI);
  if(delta < 0) delta += 2*Math.PI;
  const total = fullSpins + delta;
  const dur=3800, t0=performance.now(), sa=currentAngle;
  let lastSeg=-1, tickCount=0;

  function ease(t){ return 1-Math.pow(1-t,4); }

  function animate(now){
    const el=now-t0, t=Math.min(el/dur,1);
    currentAngle = sa + total*ease(t);
    drawWheel(currentAngle, items);
    const seg = getSegmentAtPointer(currentAngle, n);
    if(seg!==lastSeg){ lastSeg=seg; tickCount++; if(tickCount>3) playTick(); }
    if(t<1){
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      drawWheel(currentAngle, items);
      if(spinMode==='names'){
        pendingName = NAMES[targetIdx];
        spinMode = 'questions';
        drawWheel(currentAngle, partData.questions.map((_,i)=>`Q${i+1}`));
        showNameBalloon(pendingName);
        setSpinBtn('Girar — Sortear Questão', true);
        document.getElementById('spinBtn').onclick = handleSpin;
      } else {
        const q = partData.questions[targetIdx];
        showQuestionBalloon(pendingName, q, targetIdx);
        setSpinBtn('Aguarda resposta…', false);
      }
    }
  }
  requestAnimationFrame(animate);
}

/* ── BALÕES ──────────────────────────────────────────────────── */
function showNameBalloon(name){
  playPop();
  const area = document.getElementById('popupArea');
  area.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='balloon-wrap';
  const bal  = document.createElement('div'); bal.className='balloon';
  bal.innerHTML = `
    <span class="badge badge-name">Colega sorteado</span>
    <h3>É a vez de...</h3>
    <div class="big-name">${name}</div>
    <p class="name-hint">Agora gira para sortear a questão!</p>
  `;
  wrap.appendChild(bal);
  area.appendChild(wrap);
}

function showQuestionBalloon(name, q, qi){
  playPop();
  const area = document.getElementById('popupArea');
  area.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='balloon-wrap';
  const bal  = document.createElement('div'); bal.className='balloon';

  const badge = partData.type==='tf' ? 'V/F' : `Questão ${qi+1}`;
  bal.innerHTML = `<span class="badge badge-q">${partData.label} — ${badge}</span><h3>${q.q}</h3>`;

  const optsDiv = document.createElement('div'); optsDiv.className='opts';
  const expBox  = document.createElement('div'); expBox.className='exp-box';
  const contBtn = document.createElement('button'); contBtn.className='balloon-btn'; contBtn.style.display='none';

  q.opts.forEach((o,i)=>{
    const b = document.createElement('button'); b.className='opt-btn';
    b.textContent = partData.type==='tf' ? o : String.fromCharCode(65+i)+') '+o;
    b.onclick = ()=> answer(i, q.correct, optsDiv, expBox, contBtn);
    optsDiv.appendChild(b);
  });

  expBox.textContent = q.exp;

  contBtn.textContent = (partRound+1 >= 9) ? 'Avançar para a próxima parte →' : 'Próxima rodada →';
  contBtn.onclick = ()=>{
    partRound++;
    if(partRound >= 9){
      finishPart(); return;
    }
    // Volta ao modo nomes para nova rodada
    spinMode    = 'names';
    pendingName = '';
    drawWheel(currentAngle, NAMES);
    area.innerHTML = '<p class="waiting-hint"><span>Gira a roleta para sortear um colega!</span></p>';
    setSpinBtn('Girar — Sortear Colega', true);
    document.getElementById('spinBtn').onclick = handleSpin;
  };

  bal.appendChild(optsDiv);
  bal.appendChild(expBox);
  bal.appendChild(contBtn);
  wrap.appendChild(bal);
  area.appendChild(wrap);
}

/* ── RESPOSTA ────────────────────────────────────────────────── */
function answer(chosen, correct, optsDiv, expBox, contBtn){
  optsDiv.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===correct) b.classList.add('correct');
    else if(i===chosen) b.classList.add('wrong');
  });
  expBox.style.display='block';
  contBtn.style.display='block';
  totalR++;
  if(chosen===correct){ correctC++; playWin(); } else { wrongC++; playWrong(); }
  updateScore();
  setSpinBtn('Vê a resposta acima', false);
}

/* ── FIM DE PARTE ─────────────────────────────────────────────── */
function finishPart(){
  if(partIndex===0){
    document.getElementById('popupArea').innerHTML = `
      <div class="phase-box">
        <button class="phase-btn" id="phaseTwoBtn">Iniciar Parte dois</button>
        <div class="phase-note">
          Terminaste a primeira parte! Clica para continuar com o segundo bloco (Verdadeiro/Falso).
        </div>
      </div>`;
    document.getElementById('phaseTwoBtn').onclick = ()=> setupPart(1);
    setSpinBtn('Parte um concluída', false);
    drawWheel(currentAngle, NAMES);
  } else {
    setTimeout(playFanfare, 300);
    showFimPopup();
  }
}

/* ── FIM DO JOGO ─────────────────────────────────────────────── */
function showFimPopup(){
  const pct = totalR>0 ? Math.round(correctC/totalR*100) : 0;
  let emoji='🏁', msg='Bom trabalho!';
  if(pct>=90){emoji='🏆';msg='Excelente!';}
  else if(pct>=70){emoji='👏';msg='Muito bom resultado!';}
  else if(pct>=50){emoji='🙂';msg='Bom esforço, podem melhorar!';}
  else{emoji='📚';msg='Hora de estudar mais!';}

  const ov=document.createElement('div'); ov.className='fim-overlay'; ov.id='fimOverlay';
  ov.innerHTML=`
    <div class="fim-box">
      <span class="fim-trophy">${emoji}</span>
      <div class="fim-title">Fim do Jogo!</div>
      <div class="fim-sub">${msg}</div>
      <div class="fim-stats">
        <div class="fim-stat"><strong>${correctC}</strong><small>Corretas</small></div>
        <div class="fim-stat"><strong>${wrongC}</strong><small>Erradas</small></div>
        <div class="fim-stat"><strong>${pct}%</strong><small>Taxa de acerto</small></div>
      </div>
      <button class="fim-btn" onclick="reiniciarJogo()">Jogar de novo</button>
    </div>`;
  document.body.appendChild(ov);
}

function reiniciarJogo(){
  const ov=document.getElementById('fimOverlay'); if(ov) ov.remove();
  totalR=0; correctC=0; wrongC=0; updateScore();
  partIndex=-1; partData=null; spinMode='names';
  usedNames=[]; usedQuestions=[]; pendingName=''; partRound=0;
  currentAngle=0;
  drawWheel(0, NAMES);
  setSpinBtn('Parte um', false);
  document.getElementById('confMsg').textContent='';
  document.getElementById('popupArea').innerHTML=`
    <div class="phase-box">
      <button class="phase-btn" id="phaseBtn">Iniciar Parte um</button>
      <div class="phase-note">
        Clique para iniciar a primeira parte.<br>
        A roleta sorteará primeiro o colega, depois a questão.
      </div>
    </div>`;
  document.getElementById('phaseBtn').onclick = ()=> setupPart(0);
}

/* ── FULLSCREEN ──────────────────────────────────────────────── */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
}
function updateFsBtn(){
  const icon=document.getElementById('fsIconSvg'), label=document.getElementById('fsLabel');
  if(document.fullscreenElement){
    icon.innerHTML=`<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;
    label.textContent='Sair (ESC)';
  } else {
    icon.innerHTML=`<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
    label.textContent='Ecrã inteiro';
  }
}
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

/* ── ARRANQUE ────────────────────────────────────────────────── */
document.getElementById('phaseBtn').onclick = ()=> setupPart(0);
</script>
